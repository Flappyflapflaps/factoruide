# Walkable passages between zones (roads, gates, bridges, tunnels, passes).
# Walking from one zone to another goes through these points instead of a straight line
# over mountains or water. Zones are AreaTable IDs.
#
# Position: `subzone` = name of the explorable map area (position read from the game's
# map exploration data), or `at` = zone percent coordinates. Entries marked "approx" are
# estimates to refine (the collector records real zone crossings).
#
# The walkable floors come from the game's geometry (caves, tunnels, bridges, buildings): walks
# within a zone, and from a passage to a place, are the floors' own. Passages between two zones
# are the waypoints of walks from one zone to the other: keep one on each road between zones.
# A passage also joins the walkable areas within 150 yards of it (its sides): walks between two
# areas the floors do not connect go through the passages joining them. Put a passage where the
# floors break a path (`fg travel` tells the areas, `fg terrain-overrides` what the floors make
# of each passage, `fg audit --check terrain-gaps` lists the places quests use in such areas); a
# longer broken path is two passages of the same zones, one at each end (Dire Maul's road). Two
# passages of a zone are walked between over the floors, or straight when the floors break the
# road (at most 1.5 times the straight line). `lift = true`: a lift or an elevator (the floors
# do not hold it): its sides in the same walkable area are still joined through it when the
# floors' way round is long.

