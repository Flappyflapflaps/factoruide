# --- Raised places -------------------------------------------------------------------
# The top of a building (a watchtower) the terrain does not see: walks there from below, or back
# down, take `climb` yards of stairs or ramps more. `radius`: yards around `at` that are up there.
# A link (travel.toml) may leave such a place faster (a jump, a glide). <edition>/passes.toml
# adds those of one game version.

# --- Caves ---------------------------------------------------------------------------
# A cave the terrain does not hold: it holds the ground above, so the places inside stand on
# steep ground and would be walked to from wherever is nearest, maybe over a ridge. The places
# on no large walkable area within `radius` yards of `inside` are walked to through the mouth
# `at` (on the ground it opens on). `fg travel` to a place inside shows the way through it.

# Burning Blade Coven, in Valley of Trials' north wall: Yarrog Baneshadow deep inside, nearer
# Durotar's plain behind the ridge than the valley.
[[cave]]
name = "Burning Blade Coven"
at = { zone = 14, x = 45.3, y = 56.4 }     # approx: the mouth, at the valley's northern end
inside = { zone = 14, x = 43.8, y = 54.0 } # approx
radius = 120.0

# --- Ways closed in the game -------------------------------------------------------------------
# The walkable floors come from the game's geometry: a gate or a door the server places is not
# part of it, the way under it looks open. No walk goes within `radius` yards of a `[[closed]]`
# point: `world` = [continent, x, y] (world yards), or `at` = zone percent coordinates.

[[closed]]
name = "Searing Gorge - Badlands gate"   # locked: the canyon from the Badlands' west edge
world = [0, -6916.0, -2033.0]
radius = 60.0
