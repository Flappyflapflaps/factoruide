# Walkable passages between zones (roads, gates, bridges, tunnels, passes).
# Walking from one zone to another goes through these points instead of a straight line
# over mountains or water. Zones are AreaTable IDs.
#
# Position: `subzone` = name of the explorable map area (position read from the game's
# map exploration data), or `at` = zone percent coordinates. Entries marked "approx" are
# estimates to refine (the collector records real zone crossings).
#
# A passage also joins the terrain areas within 150 yards of it (its sides: both ends of a short
# tunnel, a gap in a road the terrain breaks): walks between two areas the terrain does not
# connect go through the passages joining them. Put a passage on the road where the terrain
# breaks (`fg travel` tells the areas, `fg audit --check terrain-gaps` lists those quests stand
# in). A bridge, a tunnel or a building longer than that is two passages of the same zones, one
# at each end: walked between in a straight line (Thandol Span, Blackrock Mountain, Timbermaw
# Hold). Two passages of a zone are walked between around the steep terrain, or straight when
# the terrain breaks the road (at most 1.5 times the straight line). `lift = true`: a lift or an
# elevator (the floors do not hold it): its sides in the same walkable area are still joined
# through it when the floors' way round is long.

