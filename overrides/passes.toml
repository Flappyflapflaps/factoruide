# --- Shortcuts (off-road; used when the "shortcuts" setting is on) -------------------
# A step of the guide tells to take them. `one_way = true`: only from the first zone to the second.

[[pass]]
# Climb the mountains north-east of Dun Morogh (from ~59.4,42.8 up to the ridge) and walk
# down into the Wetlands next to Menethil Harbor, skipping Loch Modan and Dun Algaz.
# Well-known route, see https://www.youtube.com/watch?v=9afQTimaiZQ
# One way: the drops into the Wetlands are not climbed back.
name = "Dun Morogh -> Wetlands mountain skip"
zones = [1, 11] # Dun Morogh, Wetlands
at = { zone = 1, x = 66.9, y = 8.5 }
shortcut = true
one_way = true

# --- Enclosed areas ------------------------------------------------------------------
# Large walkable areas left only by boat, portal or lift (overrides/travel.toml), or through the
# passages joining them: no other walk to or from them. The area is the floors', around `at`
# (not the mainland's: an area the floors join to it is walked out of by the floors' ways, as
# Valley of Trials by its road or Mount Hyjal by Darkwhisper Gorge); the entries of one name are
# one place (walks between its areas are not cut). Elsewhere, places the floors do not connect
# are still walked between, priced longer than the straight line: `fg audit --check
# terrain-gaps` lists them, to declare here or to accept in audit.toml.

[[enclosed]]
name = "Rut'theran Village"         # the boat to Auberdine, the portal up to Darnassus
at = { zone = 141, x = 55.5, y = 90.0 }

[[enclosed]]
name = "Teldrassil"                 # the portal down to Rut'theran Village
at = { zone = 141, x = 56.0, y = 60.0 }

# --- Caves ---------------------------------------------------------------------------
# A cave the terrain does not hold: it holds the ground above, so the places inside stand on
# steep ground and would be walked to from wherever is nearest, maybe over a ridge. The places
# on no large walkable area within `radius` yards of `inside` are walked to through the mouth
# `at` (on the ground it opens on). `fg travel` to a place inside shows the way through it.
# None now: the floors hold the caves (Burning Blade Coven, in Valley of Trials' north wall).

# --- Ways closed in the game -------------------------------------------------------------------
# The walkable floors come from the game's geometry: a gate or a door the server places is not
# part of it, the way under it looks open. No walk goes within `radius` yards of a `[[closed]]`
# point: `world` = [continent, x, y] (world yards), or `at` = zone percent coordinates.

[[closed]]
name = "Searing Gorge - Badlands gate"   # locked: the canyon from the Badlands' west edge
world = [0, -6916.0, -2033.0]
radius = 60.0
