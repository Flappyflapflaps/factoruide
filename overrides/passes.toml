# --- Enclosed areas ------------------------------------------------------------------
# Large walkable areas left only by boat, portal or lift (overrides/travel.toml), or through the
# passages joining them: no other walk to or from them. The area is the terrain's, around `at`;
# the entries of one name are one place (walks between its areas are not cut). Elsewhere, places
# the terrain does not connect are still walked between, priced longer than the straight line
# (tunnels, bridges and gates are buildings, not terrain): `fg audit --check terrain-gaps` lists
# them, to declare here or to accept in audit.toml.

[[enclosed]]
name = "Rut'theran Village"         # the boat to Auberdine, the portal up to Darnassus
at = { zone = 141, x = 55.5, y = 90.0 }

[[enclosed]]
name = "Teldrassil"                 # the portal down to Rut'theran Village
at = { zone = 141, x = 56.0, y = 60.0 }

