# WoW Forever's walking (added to ../passes.toml, the passages of every game version).

# Mount Hyjal is reached only through Winterspring's Darkwhisper Gorge, whose end climbs to
# the Tainted Foothills: walked in a straight line between the gorge's two ends; the rest of the
# mountain is enclosed (no walk up from Felwood or Winterspring elsewhere).
[[pass]]
name = "Darkwhisper Gorge"
zones = [618, 616] # Winterspring, Mount Hyjal
at = { zone = 618, x = 56.5, y = 71.6 }

[[pass]]
name = "Darkwhisper Gorge, Mount Hyjal end"
zones = [618, 616]
at = { zone = 616, x = 85.8, y = 68.8 }

[[enclosed]]
name = "Mount Hyjal"                # Tainted Foothills
at = { zone = 616, x = 55.1, y = 82.6 }

[[enclosed]]
name = "Mount Hyjal"                # Summit of Eternity
at = { zone = 616, x = 68.6, y = 44.1 }

[[enclosed]]
name = "Mount Hyjal"                # the west, Ortak Lomgok's inn
at = { zone = 616, x = 12.8, y = 52.4 }

