# WoW Forever's walking (added to ../passes.toml, the passages of every game version).

# Mount Hyjal is reached only through Winterspring's Darkwhisper Gorge, whose end climbs to
# the Tainted Foothills (the floors hold the gorge, and nothing else joins the mountain to the
# land around): the waypoint of walks between the two zones.
[[pass]]
name = "Darkwhisper Gorge"
zones = [618, 616] # Winterspring, Mount Hyjal
at = { zone = 618, x = 56.5, y = 71.6 }

# Riverglades, between the Badlands, Redridge and the Swamp of Sorrows: its roads out.
[[pass]]
name = "Riverglades - Badlands road"
zones = [16591, 3]
at = { zone = 16591, x = 32.2, y = 30.8 }

[[pass]]
name = "Riverglades - Redridge road"
zones = [16591, 44]
at = { zone = 16591, x = 26.0, y = 64.0 }

[[pass]]
name = "Riverglades - Swamp of Sorrows road"
zones = [16591, 8]
at = { zone = 16591, x = 42.5, y = 97.0 }

# Thendal Grove's watchtower (Zephras Isle): Halaan Hawk-Eye and Myriaal Mistwake stand on top.
# The quick way down is the Skyborne's glide, Walk on Air (travel.toml).
[[raised]]
name = "Thendal Grove watchtower"
at = { zone = 16593, x = 43.71, y = 24.08 }
radius = 5.0
climb = 60.0 # approx: the stairs up the tower (about 10 s)

# Paths the floors break into pieces (a passage at each end of a long one): the plateau they
# lead to is apart from the land around. Feralas: the Lower Wilds up to Dire Maul's plateau.
[[pass]]
name = "Dire Maul road, foot"
zones = [357, 357]
at = { zone = 357, x = 54.5, y = 44.7 }

[[pass]]
name = "Dire Maul road, top"
zones = [357, 357]
at = { zone = 357, x = 55.8, y = 42.5 }

