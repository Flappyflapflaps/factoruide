# --- Skyborne starting island (Zephras Isle) ---
# The last island quest sends you away: "The Magical City of Dalaran" (Alliance) to Denaaris
# Stargale in Dalaran, "The Earthen Ring" (Horde) to Alaana Stormwalker in Mulgore. The trip
# is a teleport from the quest giver (no way back).
[[link]]
name = "Zephras Isle - Dalaran"
faction = "Alliance"
from = { zone = 16593, x = 66.59, y = 79.92 } # Quest giver of The Magical City of Dalaran
to = { zone = 36, x = 12.37, y = 56.3 }       # Denaaris Stargale
