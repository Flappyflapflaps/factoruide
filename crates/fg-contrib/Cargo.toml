[package]
name = "fg-contrib"
publish = false
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
getrandom = { version = "0.4", optional = true }
mlua = { version = "0.12", features = ["lua51", "vendored", "send"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["local"]
# Reading a game client folder (SavedVariables need Lua). Without it, only the contribution
# format and its validation (what the contribution server needs).
local = ["dep:mlua", "anonymize"]
# Turning recorded characters into anonymous ones (random ids): what the web app needs, which
# gets the recordings from the addon's export instead of the game folder.
anonymize = ["dep:getrandom"]

[lints]
workspace = true
