[package]
name = "fg-web"
publish = false
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The app's backend for the browser: built for `wasm32-wasip1-threads` (see web/README.md), run
# by web/src/host in Web Workers sharing one memory, so that the planner's threads are threads.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
fg-route = { path = "../fg-route" }
miniz_oxide = "0.8"
rusqlite = { version = "0.40", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.14"

[lints]
workspace = true
