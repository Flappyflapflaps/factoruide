# cargo deny check: known vulnerabilities, licenses and origin of the dependencies.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported, but only for direct dependencies.
unmaintained = "workspace"
# zip 4 comes only with tauri-plugin-updater (Windows), whose releases still ask for it (the
# plugin's next version moves to zip 9). These flaws are about symlinks and Unix permissions when
# extracting an archive; the updater only extracts packages whose signature by the publisher's key
# it has checked first. To remove once tauri-plugin-updater depends on zip 9.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip via tauri-plugin-updater only, signed packages, no fixed release yet" },
    { id = "RUSTSEC-2026-0368", reason = "zip via tauri-plugin-updater only, signed packages, no fixed release yet" },
    { id = "RUSTSEC-2026-0369", reason = "zip via tauri-plugin-updater only, signed packages, no fixed release yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
