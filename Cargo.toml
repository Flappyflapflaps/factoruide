[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
# Contributions format and readers of the game client's quest cache and of the addon's
# recordings.
fg-contrib = { path = "crates/fg-contrib" }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that don't pay off here: game data is full of conversions between database
# columns, ids and coordinates, and the crates are not a published API.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
doc_markdown = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
# Restriction lints worth having.
allow_attributes = "warn"
dbg_macro = "warn"
empty_drop = "warn"
get_unwrap = "warn"
unwrap_used = "warn"
lossy_float_literal = "warn"
mem_forget = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
str_to_string = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
verbose_file_reads = "warn"

# The release profile is Cargo's default on purpose. Measured on 2026-10-26 (human:mage to level 40,
# effort 1, same seed): `lto = "fat"` with `codegen-units = 1` gives the same route in 40.9 s
# against 39.6 s, and builds 7 times slower (2m11 against 19 s for `fg`). The time goes into the
# search's own loops, which are already in one crate. Measure again before changing it.

# Release code with line tables for perf and flamegraphs, in its own target/profiling directory
# so that it never invalidates the release build (scripts/profile.sh adds the frame pointers).
[profile.profiling]
inherits = "release"
debug = "line-tables-only"

# Iterating on tests: release-derived (the planner tests are too slow in debug) but compiled
# fast and incrementally. `cargo test --profile fast -p fg-route <name>`; the full
# `cargo test --release` runs once before pushing (scripts/check.sh).
[profile.fast]
inherits = "release"
opt-level = 1
codegen-units = 256
incremental = true
