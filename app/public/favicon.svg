<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#03070f"/>
      <stop offset="0.65" stop-color="#050e20"/>
      <stop offset="1" stop-color="#0b1a36"/>
    </linearGradient>
    <radialGradient id="halo" cx="512" cy="560" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a4dff" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#2a3de6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2a3de6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="512" cy="800" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd100" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="170" x2="0" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6b8"/>
      <stop offset="0.18" stop-color="#ffe14d"/>
      <stop offset="0.6" stop-color="#ffc400"/>
      <stop offset="1" stop-color="#d98a00"/>
    </linearGradient>
    <radialGradient id="dotgold" cx="490" cy="772" r="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6b8"/>
      <stop offset="0.45" stop-color="#ffd21f"/>
      <stop offset="1" stop-color="#c97a00"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect x="64" y="64" width="896" height="896" rx="190"/></clipPath>
    <!-- The bar of the quest mark turned into an arrow: a tapering blade with a barbed head. -->
    <path id="arrow" d="M 414 166 Q 512 140 610 166 L 566 492 L 646 484 L 512 664 L 378 484 L 458 492 Z"/>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sky)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#halo)"/>
    <circle cx="512" cy="800" r="190" fill="url(#spot)"/>
  </g>
  <rect x="66" y="66" width="892" height="892" rx="188" fill="none" stroke="#23344f" stroke-width="4"/>

  <!-- Dark outline, as the game draws its quest marks. -->
  <g fill="#1a0d00" stroke="#1a0d00" stroke-width="44" stroke-linejoin="round">
    <use href="#arrow"/>
    <circle cx="512" cy="796" r="74"/>
  </g>
  <g stroke="#7a4300" stroke-width="10" stroke-linejoin="round">
    <use href="#arrow" fill="url(#gold)"/>
    <circle cx="512" cy="796" r="74" fill="url(#dotgold)"/>
  </g>
  <!-- Bevel: a light left face on the blade and on the head. -->
  <path d="M 422 176 Q 466 158 512 156 L 512 650 L 394 496 L 466 504 Z" fill="url(#shine)" opacity="0.55"/>
  <ellipse cx="490" cy="772" rx="30" ry="20" fill="#ffffff" opacity="0.6" transform="rotate(-30 490 772)"/>
</svg>
