name: Release

# Pushing a tag vX.Y.Z (scripts/release.sh) builds the Windows installer, the macOS apps and the
# Linux app, signs the updates and publishes them as a GitHub release, with latest.json: installed
# apps offer it at startup. It also publishes the addons whose version is the tag's (CurseForge,
# Wago, zips in the release) and deploys the web app (Cloudflare Pages). Run by hand with a tag, it builds the macOS and/or Linux apps and adds
# them to that tag's release.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to add the apps to (vX.Y.Z)
        required: true
      platforms:
        description: Apps to build
        type: choice
        options: [macos and linux, macos, linux]
        default: macos and linux

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  CARGO_TERM_COLOR: always
  # Built into the app: where the "Contribute" page sends the players' data (straight to the
  # server; the older apps' address is the web app's now, which relays: web/functions).
  FG_CONTRIBUTION_SERVER: https://api.factoruide.brouznouf.com
  # A published build: it checks for updates (local and development builds do not).
  FG_RELEASE: "1"
  # The addon's page the apps link to (repository variable, once its CurseForge project exists).
  VITE_FG_ADDON_URL: ${{ vars.ADDON_URL }}

jobs:
  windows:
    name: Windows installer
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # The app version (Cargo.toml) comes from the tag; the tag message is the release notes.
      - name: Version and notes from the tag
        id: tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "0,/^version = .*/s//version = \"$version\"/" app/src-tauri/Cargo.toml
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "notes<<EOF"
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Factoruide ${{ github.ref_name }}
          releaseBody: ${{ steps.tag.outputs.notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  # Added to the release the Windows job published (or the one given by hand), one after the other:
  # each adds its platform to latest.json, which two jobs at once would overwrite. Ad-hoc signed,
  # not notarized: macOS asks the player to allow the app the first time, not on updates.
  macos:
    name: macOS app (${{ matrix.arch }})
    needs: windows
    # Also when the Windows job is skipped (run by hand).
    if: ${{ !cancelled() && needs.windows.result != 'failure' && inputs.platforms != 'linux' }}
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    strategy:
      max-parallel: 1
      matrix:
        include:
          - arch: Apple Silicon
            target: aarch64-apple-darwin
          - arch: Intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Release of the tag (published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName
      - name: Version from the tag
        run: perl -0pi -e "s/^version = .*/version = \"${TAG#v}\"/m" app/src-tauri/Cargo.toml
      - name: Rust toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          uploadUpdaterJson: true
          # The .dmg to install, the .app.tar.gz for the updates (left out of local builds). The
          # signature too, for the tags older than tauri.macos.conf.json. Single quotes:
          # tauri-action drops the double ones around an argument.
          args: >-
            --target ${{ matrix.target }} --bundles app,dmg
            --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'

  # After the macOS apps, for latest.json. Built on the oldest supported Ubuntu: the executable runs
  # on any distribution with this glibc or a newer one. The AppImage carries WebKitGTK and updates
  # itself; the executable alone needs the system's WebKitGTK 4.1.
  linux:
    name: Linux app (x86_64)
    needs: macos
    # Also when the previous jobs are skipped (run by hand).
    if: ${{ !cancelled() && needs.macos.result != 'failure' && inputs.platforms != 'macos' }}
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Release of the tag (published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName
      - name: Version from the tag
        run: sed -i "0,/^version = .*/s//version = \"${TAG#v}\"/" app/src-tauri/Cargo.toml
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Frontend dependencies
        working-directory: app
        run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          uploadUpdaterJson: true
          # The signature (left out of local builds) for the updates; single quotes as above.
          args: >-
            --bundles appimage
            --config '{"bundle":{"targets":["appimage"],"createUpdaterArtifacts":true}}'
      - name: Executable alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="Factoruide_${TAG#v}_amd64"
          cp target/release/factoruide-app "$out"
          tar czf "$out.tar.gz" "$out"
          gh release upload "$TAG" "$out.tar.gz" --clobber

  # Each addon whose version is the tag's (scripts/release.sh gives it to those changed since the
  # last release): its folder alone, packaged and uploaded by the BigWigs packager to its
  # CurseForge and Wago projects (repository variables for their ids, secrets for the tokens;
  # skipped without them), and its zip added to the release.
  addons:
    name: Addon ${{ matrix.addon }}
    needs: windows
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - addon: Factoruide_Profile
            curseforge: ${{ vars.CURSEFORGE_PROFILE_ID }}
            wago: ${{ vars.WAGO_PROFILE_ID }}
          - addon: Factoruide_Guide
            curseforge: ${{ vars.CURSEFORGE_GUIDE_ID }}
            wago: ${{ vars.WAGO_GUIDE_ID }}
            # The CurseForge project it needs (a relation of each file uploaded).
            requires: ${{ vars.CURSEFORGE_PROFILE_SLUG }}
    env:
      ADDON: ${{ matrix.addon }}
      REQUIRES: ${{ matrix.requires }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Changed in this release
        id: changed
        run: |
          if grep -q "^## Version: ${TAG#v}$" "addon/$ADDON/$ADDON.toc"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$ADDON: unchanged since its last release, not published"
          fi
      # The folder as its own repository tagged like the release: the packager zips it whole,
      # names it after the tag and takes the release notes as its changelog.
      - name: Addon folder
        if: steps.changed.outputs.publish
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          pkg="$RUNNER_TEMP/$ADDON"
          cp -r "addon/$ADDON" "$pkg"
          git tag -l --format='%(contents)' "$TAG" > "$pkg/CHANGES.md"
          printf 'package-as: %s\nmanual-changelog:\n  filename: CHANGES.md\n  markup-type: markdown\n' "$ADDON" > "$pkg/.pkgmeta"
          if [ -n "$REQUIRES" ]; then printf 'required-dependencies:\n  - %s\n' "$REQUIRES" >> "$pkg/.pkgmeta"; fi
          cd "$pkg"
          git init -q
          git add -A
          git -c user.name=Factoruide -c user.email=release@factoruide.invalid commit -q -m "$TAG"
          git tag "$TAG"
      - uses: BigWigsMods/packager@v2
        if: steps.changed.outputs.publish
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        with:
          args: >-
            -t ${{ runner.temp }}/${{ matrix.addon }} -r ${{ runner.temp }}/release
            ${{ matrix.curseforge && format('-p {0}', matrix.curseforge) || '' }}
            ${{ matrix.wago && format('-a {0}', matrix.wago) || '' }}
      - name: Zip in the release
        if: steps.changed.outputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/release/*.zip --clobber

  # The web app: built from the tag and deployed to Cloudflare Pages with its relay of /v1/* to the
  # contribution server (web/functions). Secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
  # FG_PROXY_KEY (the key the server is started with), variable CLOUDFLARE_PAGES_PROJECT
  # (default factoruide); skipped without the token.
  web:
    name: Web app
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'factoruide' }}
      WASI_SDK: "34"
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (from rust-toolchain.toml) and the browser's target
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: wasi-sdk (the C parts of the backend)
        run: |
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-$WASI_SDK/wasi-sdk-$WASI_SDK.0-x86_64-linux.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "WASI_SDK_PATH=$RUNNER_TEMP/wasi-sdk-$WASI_SDK.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Build
        env:
          FG_VERSION: ${{ github.ref_name }}
        run: FG_VERSION="${FG_VERSION#v}" scripts/build-web.sh
      # The project (the first time) and the relay's key, then the pages and the relay.
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: web
        env:
          FG_PROXY_KEY: ${{ secrets.FG_PROXY_KEY }}
        run: |
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch=main || true
          if [ -n "$FG_PROXY_KEY" ]; then
            printf '%s' "$FG_PROXY_KEY" | npx --yes wrangler@4 pages secret put PROXY_KEY --project-name="$PROJECT"
          fi
          npx --yes wrangler@4 pages deploy dist --project-name="$PROJECT" --branch=main
